name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.spike }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spike:
          - spike-1
          - spike-2
          - spike-3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Run formatting, Python syntax, and Terraform validation
        run: make SPIKE=${{ matrix.spike }} check-all

  e2e:
    name: Floci E2E (${{ matrix.spike }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spike:
          - spike-1
          - spike-2
          - spike-3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Run local Floci end-to-end flow
        run: make SPIKE=${{ matrix.spike }} e2e
